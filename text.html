<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Loading Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

.loader{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    z-index:9999;
}

.line{
    position:absolute;
    width:2px;
    height:0;
    background:#fff;
    box-shadow:0 0 20px rgba(255,255,255,.8);
    animation:
        growVertical .6s ease forwards,
        expandHorizontal .5s ease .6s forwards,
        revealHero .8s ease 1.2s forwards;
}

.hero-preview{
    position:absolute;
    width:0;
    height:0;
    overflow:hidden;
    border-radius:24px;
    opacity:0;
}

.hero-preview video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero{
    position:relative;
    height:100vh;
    width:100%;
    opacity:0;
    transform:scale(1.1);
    animation:showHero .8s ease 2s forwards;
}

.hero video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.2),
        rgba(0,0,0,.6)
    );
}

.content{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:#fff;
}

.content h1{
    font-size:4rem;
    margin-bottom:20px;
}

.content p{
    font-size:1.2rem;
}

@keyframes growVertical{
    from{
        height:0;
    }
    to{
        height:300px;
    }
}

@keyframes expandHorizontal{
    from{
        width:2px;
    }
    to{
        width:600px;
        height:300px;
        border-radius:20px;
    }
}

@keyframes revealHero{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

@keyframes showHero{
    from{
        opacity:0;
        transform:scale(1.15);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}
</style>
</head>
<body>

<div class="loader">
    <div class="line"></div>

    <div class="hero-preview">
        <video autoplay muted loop>
            <source src="hero-video.mp4" type="video/mp4">
        </video>
    </div>
</div>

<section class="hero">
    <video autoplay muted loop>
        <source src="hero-video.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="content">
        <h1>Explore the World</h1>
        <p>Luxury Hotels, Tours & Experiences</p>
    </div>
</section>

</body>
</html>
